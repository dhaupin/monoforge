# Freestruct post-render SEO layer for the baked docs.
# Canonical math: site.url + basePath + relSlug => docs.creadev.org/monoforge/<page>
site:
  name: monoforge docs
  url: https://docs.creadev.org
  description: The fleet factory - stamp a repo from proven template blocks, doctor it for truth, lock it verifiably.
basePath: /monoforge
# Twitter spots intentionally left for the fleet house defaults:
# twitter: { username: "@..." }

# Open Graph - rendered by web/scripts/build-og.mjs (Liberation Sans via
# resvg), committed as docs/og-image.png alongside the product site card.
og:
  image: /og-image.png
  type: website
  locale: en_US

# Author identity: ships as a schema.org Person under "founder" on the
# injected Organization JSON-LD block - the same ownership shape the
# product site carries (issue gistory#13).
author:
  name: Creadev.org
  url: https://creadev.org

# Maintainer identity: custom JSON-LD appended after the built-in
# Organization + WebSite blocks (missing-only gate keeps pages that arrive
# with their own ld+json untouched).
jsonLd:
  - "@type": Person
    name: dhaupin
    url: https://github.com/dhaupin
    jobTitle: monoforge maintainer

# The baked output tree (discovered by freestruct from docs/).
outputDir: _site

# linkCheck suspended until upstream lands (dhaupin/freestruct#32): the 1.1.0
# strict link checker resolves root-absolute hrefs (`/monoforge/...`) against
# the artifact root with no basePath awareness, so every baseurl'd site in the
# family fails --strict on its own nav. The fix is on freestruct main (1.2.0)
# but unpublished, so the pinned 1.1.0 keeps failing until then. The rest of
# the strict gate stays on (canonical/sitemap, og, noindex, dangerous tags),
# and the docs-gates step still link-checks the markdown sources.
# Flip back to default (remove this line) when #32 ships in a pinned release.
linkCheck: false
