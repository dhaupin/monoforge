# docs - a THIN caller of THE one docs lane (dhaupin/freestruct).
#
# The runbook (Jekyll, the hardened pagefind scrape, the pinned freestruct
# post-build layer, the optional crashtest dogfood campaign, the Pages upload,
# the main-gated deploy) lives ONCE in the lane. This file keeps only what is
# per-repo: the trigger, the permissions, and the concurrency group. The lane
# defaults (ruby 3.4, node 22, freestruct 1.3.0 EXACT, --strict) fit a repo
# that brings its own docs tree; pass `with:` inputs to override them.
#
# The docs truth gates (npm run lint:docs) run in test.yml, not here: a
# workflow_call caller cannot carry extra steps, so they stay in the battery.
name: docs

on:
  push:
    branches: [main, staging]
    paths: ['docs/**', 'scripts/**', '.github/workflows/docs.yml']
  workflow_dispatch:

# GitHub Pages deploy permissions (official deploy-pages action)
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    # Pinned to the lane's SHA (pins, never floats): a moving @main would let
    # the runbook change under us between runs.
    uses: dhaupin/freestruct/.github/workflows/docs-lane.yml@7dfb1722d16b2ee173e8d4cbbd6106eecec11a1a # main
